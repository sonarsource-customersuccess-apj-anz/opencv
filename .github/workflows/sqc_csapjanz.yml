name: "SonarQube Cloud Scan"
on:
  push:
    branches:
      - master
      - '*.x'
  pull_request:
    types: [opened, synchronize, reopened]
jobs:
  sonar:
    uses: sonarsource-customersuccess-apj-anz/sonar-workflows/.github/workflows/sonarqube-cloud-scan.yml@main
    with:
      project_key: sonarsource-customersuccess-apj-anz_opencv
    secrets:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
